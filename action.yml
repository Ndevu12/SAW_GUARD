name: 'SAW Guard'
description: 'Hunt supply-chain worm indicators — obfuscated loaders, fake fonts, VS Code auto-run, evil merges — and fail CI.'
author: 'Ndevu12'
branding:
  icon: 'eye'
  color: 'purple'

inputs:
  version:
    description: 'stayawakebot version from PyPI; blank = latest. Pin in production.'
    required: false
    default: ''
  config-file:
    description: >-
      Repo-relative path to your committed `saw` config whose `settings` and `allowlist` govern
      the scan — the single source of truth; SAW Guard adds no settings of its own. Defaults to the
      conventional `config/security.yml` when your repo ships one; otherwise the scanner's
      built-in defaults are used.
    required: false
    default: ''
  fail-on:
    description: >-
      Verdict tier that turns the gate red. 'infected' (default) fails only on a confirmed
      infection. 'suspicious' also fails on suspect-tier findings — e.g. a historical evil merge
      still in the commit graph after the tree itself was cleaned. 'never' reports without gating
      on the verdict (outputs and the step summary still carry it). Scan infrastructure failures —
      no target scanned, an errored target, an unparseable report, a usage error — fail the job
      REGARDLESS of this input: a security gate must never read a non-scan as clean. To soften
      those too, use GitHub's native `continue-on-error: true` on the step.
    required: false
    default: 'infected'
  require-db:
    description: >-
      'true' passes --require-db so the scan fails instead of silently degrading to the inline
      malware seed when the offline advisory DB is absent or fails its integrity check — for
      gates that must not lose coverage without noticing.
    required: false
    default: 'false'
  remediate:
    description: >-
      'pr' runs `saw fix --pr` after an infected verdict: saw rebuilds the fix in an isolated
      worktree off the remote's default branch, pushes the stable `security/auto-clean` branch,
      and opens/updates ONE rolling PR per repo (never committing to the default branch itself).
      The gate STAYS RED — remediation is a courtesy, and only a clean tree turns the check
      green. Requires `contents: write` and `pull-requests: write` permissions plus the
      repository setting "Allow GitHub Actions to create and approve pull requests". Without
      push access saw degrades down its fallback ladder (fork PR, else a git-am-able patch in
      sab-patches/ plus a deduplicated issue) — the `remediation` output says which happened, and
      anything short of a pull request is flagged on the run with its cause.
      Default 'off'.
    required: false
    default: 'off'
  github-token:
    description: >-
      Token used by `remediate: pr` (push the fix branch / open the PR) and by the opt-in
      `pr-comment` step. Defaults to the workflow token; pass a PAT or GitHub App token instead if
      the fix PR itself must trigger your CI (events created with the default GITHUB_TOKEN don't
      start workflows).
    required: false
    default: ${{ github.token }}
  upload-sarif:
    description: >-
      'true' uploads the scanner's redacted SARIF 2.1.0 report to GitHub code scanning, so findings
      appear in the Security tab and as inline annotations on the exact line. Purely additive — it
      never changes the gate. Requires `security-events: write` on the job (grant it ONLY when you
      enable this; do not blanket-grant). Degrades to a notice — never a failure — when the scanner
      is too old to emit SARIF, on a fork PR, or when the permission is absent. Default 'false'.
    required: false
    default: 'false'
  upload-artifact:
    description: >-
      'true' uploads the scanner's REDACTED reports (JSON + Markdown), the SARIF, and any
      `sab-patches/*.patch` as a run artifact, so the evidence travels with the run. Never uploads
      the full-evidence report or the raw infected file. Needs no extra permission (works on fork
      PRs). Note: a fix patch is a diff that removes the payload, so its removed lines contain the
      payload — apply it in a controlled clone. Default 'false'.
    required: false
    default: 'false'
  pr-comment:
    description: >-
      'true' posts (and, on re-runs, updates in place) ONE sticky pull-request comment with the
      per-finding remediation guidance on `pull_request` events. Additive — never changes the gate.
      Requires `pull-requests: write` on the job. Degrades to a notice on a fork PR or when the
      permission is absent. Default 'false'.
    required: false
    default: 'false'

outputs:
  verdict:
    description: "Overall scan verdict: 'clean', 'suspicious', or 'infected'."
    value: ${{ steps.scan.outputs.verdict }}
  infected:
    description: 'Number of infected targets.'
    value: ${{ steps.scan.outputs.infected }}
  suspicious:
    description: 'Number of suspicious (but not infected) targets.'
    value: ${{ steps.scan.outputs.suspicious }}
  findings:
    description: 'Total number of findings across all targets.'
    value: ${{ steps.scan.outputs.findings }}
  report:
    description: 'Path to the full-evidence JSON report on the runner.'
    value: ${{ steps.scan.outputs.report }}
  sarif:
    description: >-
      Path to the redacted SARIF 2.1.0 report on the runner, or empty when the installed scanner is
      too old to emit SARIF. Upload it yourself (e.g. github/codeql-action/upload-sarif) if you want
      code scanning but prefer to scope `security-events: write` in your own workflow.
    value: ${{ steps.scan.outputs.sarif }}
  remediation:
    description: >-
      What `remediate: pr` came to: 'pr', 'fork-pr', 'patch', 'issue', 'prepared', 'skipped' or
      'failed', or 'unknown' when the installed scanner cannot say. Empty when remediation did not
      run.
    value: ${{ steps.remediate.outputs.remediation }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6.3.0
      with:
        # stayawakebot requires Python >=3.11; 3.13 is a current, supported interpreter.
        python-version: '3.13'
        check-latest: true

    - name: Install scanner from PyPI
      shell: bash
      run: |
        if [ -n "${{ inputs.version }}" ]; then
          pip install "stayawakebot==${{ inputs.version }}"
        else
          pip install stayawakebot
        fi

    - name: Assert the saw CLI is available
      shell: bash
      # The scan step drives the `saw` CLI. Fail fast with a clear fix if the installed
      # stayawakebot predates it (e.g. an old pinned `version`), instead of an opaque
      # "saw: command not found" mid-scan.
      run: |
        if ! command -v saw >/dev/null 2>&1; then
          echo "::error::installed stayawakebot lacks the 'saw' CLI — set the 'version' input to a release that ships it." >&2
          exit 1
        fi
        echo "saw CLI OK ($(saw --version 2>/dev/null | head -n1))"

    - name: SAW Guard — say when remediation cannot open a pull request
      if: inputs.remediate == 'pr' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
      shell: bash
      run: echo "::warning title=SAW Guard remediation::remediate is 'pr', but this is a pull request from a fork — GitHub gives it a read-only token, so a fix can only be saved as a patch."

    - name: Run worm scan
      id: scan
      shell: bash
      # This step RUNS the scan and fails closed on anything that means "the scan did not
      # really happen": unparseable report, usage/internal error, zero targets, an errored
      # target. It does NOT gate on the verdict — that happens in the final "Enforce verdict
      # gate" step, after optional remediation, so a fix PR can be opened before the job goes
      # red. A security gate must NEVER read a non-scan as clean, so the fail-closed checks
      # here apply regardless of `fail-on`.
      run: |
        set -euo pipefail
        case "${{ inputs.fail-on }}" in
          infected|suspicious|never) ;;
          *) echo "::error::fail-on must be 'infected', 'suspicious', or 'never' (got '${{ inputs.fail-on }}')." >&2; exit 1;;
        esac
        # Config source — single source of truth; SAW Guard synthesizes nothing. An explicit
        # config-file wins; else the conventional config/security.yml when the repo ships one;
        # else the scanner's built-in defaults. The positional target scopes the scan to the
        # checked-out repo, overriding any `targets` in the config. The resolved path is exported
        # so the remediation step applies the exact same allowlist as the scan.
        cfg_flag=()
        cfg=""
        if [ -n "${{ inputs.config-file }}" ]; then
          cfg="$GITHUB_WORKSPACE/${{ inputs.config-file }}"
          if [ ! -f "$cfg" ]; then
            echo "::error::config-file '${{ inputs.config-file }}' not found in the repo — check the path or leave it empty." >&2
            exit 1
          fi
          cfg_flag=(-c "$cfg")
        elif [ -f "$GITHUB_WORKSPACE/config/security.yml" ]; then
          cfg="$GITHUB_WORKSPACE/config/security.yml"
          cfg_flag=(-c "$cfg")
        fi
        # Optional flags are capability-probed against `saw scan -h` so an older pinned
        # `version` degrades cleanly: a missing --reports-dir just skips the summary, but a
        # missing --require-db when the caller asked for it is a hard error — the caller asked
        # for a coverage guarantee this install cannot provide.
        extra=()
        if [ "${{ inputs.require-db }}" = "true" ]; then
          if saw scan -h 2>/dev/null | grep -q -- '--require-db'; then
            extra+=(--require-db)
          else
            echo "::error::require-db is 'true' but the installed stayawakebot lacks --require-db — set 'version' to a release that ships it." >&2
            exit 1
          fi
        fi
        # A deterministic reports dir (not mktemp) so the additive visibility steps — and even an
        # aborted-scan summary — can find the report and the scanner's redacted bundle by path.
        # Defined ONCE here and exported to the job env so every later step shares it (no repeated
        # literal); set before any fail-closed exit so the always() summary step still sees it.
        reports_dir="$RUNNER_TEMP/saw-guard-reports"
        mkdir -p "$reports_dir"
        echo "SAW_GUARD_REPORTS_DIR=$reports_dir" >> "$GITHUB_ENV"
        if saw scan -h 2>/dev/null | grep -q -- '--reports-dir'; then
          extra+=(-d "$reports_dir")
        fi
        # SARIF is capability-probed like the other optional flags: a missing --sarif on an old
        # pinned `version` just leaves `sarif` empty (the upload step then no-ops) — it never fails.
        # The file is the scanner's own REDACTED SARIF (evidence fingerprinted, not raw).
        sarif=""
        if saw scan -h 2>/dev/null | grep -q -- '--sarif'; then
          sarif="$reports_dir/saw-guard.sarif"
          extra+=(--sarif "$sarif")
        fi
        report="$reports_dir/report.json"
        set +e
        saw scan "$GITHUB_WORKSPACE" "${cfg_flag[@]+"${cfg_flag[@]}"}" "${extra[@]+"${extra[@]}"}" --json > "$report"
        rc=$?
        set -e
        # Parse the machine-readable report and FAIL CLOSED unless it proves a real scan ran.
        if ! targets=$(python3 -c "import json;print(int((json.load(open('$report')).get('summary') or {}).get('targets',0) or 0))" 2>/dev/null); then
          echo "::error::saw scan produced no parseable JSON report (rc=$rc) — failing closed." >&2
          exit 1
        fi
        errored=$(python3 -c "import json;print(sum(1 for r in (json.load(open('$report')).get('results') or []) if r.get('error')))")
        infected=$(python3 -c "import json;print(sum(1 for r in (json.load(open('$report')).get('results') or []) if r.get('infected') or r.get('verdict')=='infected'))")
        suspicious=$(python3 -c "import json;print(sum(1 for r in (json.load(open('$report')).get('results') or []) if (r.get('suspicious') or r.get('verdict')=='suspicious') and not (r.get('infected') or r.get('verdict')=='infected')))")
        findings=$(python3 -c "import json;print(int((json.load(open('$report')).get('summary') or {}).get('findings',0) or 0))")
        echo "SAW Guard: scanned ${targets} target(s); infected=${infected}, suspicious=${suspicious}, findings=${findings}, scan rc=${rc}."
        if [ "$rc" != "0" ] && [ "$rc" != "1" ]; then
          echo "::error::saw scan exited ${rc} (usage/internal error — or, with require-db, a missing/corrupt advisory DB) — failing closed." >&2; exit "${rc:-1}"
        fi
        if [ "$targets" -lt 1 ]; then
          echo "::error::saw scan found NO target to scan (missing checkout, wrong path, or empty tree) — failing closed instead of a green no-op." >&2; exit 1
        fi
        if [ "$errored" -gt 0 ]; then
          echo "::error::saw scan could NOT process ${errored} target(s) — e.g. an unreadable or malformed config. Failing closed: a config that can't be applied must never read as clean." >&2; exit 1
        fi
        verdict=clean
        if [ "$suspicious" -gt 0 ]; then verdict=suspicious; fi
        if [ "$infected" -gt 0 ] || [ "$rc" = "1" ]; then verdict=infected; fi
        {
          echo "verdict=$verdict"
          echo "infected=$infected"
          echo "suspicious=$suspicious"
          echo "findings=$findings"
          echo "report=$report"
          echo "sarif=$sarif"
          echo "scan-rc=$rc"
          echo "config=$cfg"
        } >> "$GITHUB_OUTPUT"
        # Human-readable verdict on the run page. saw's own redacted latest.md when the
        # installed release writes one; a one-line fallback otherwise.
        if [ -f "$reports_dir/latest.md" ]; then
          cat "$reports_dir/latest.md" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "**SAW Guard**: ${verdict} — ${targets} target(s), ${findings} finding(s)." >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: SAW Guard — render the full scan report to the log (redacted, issue #12)
      if: always()
      shell: bash
      # Parity with a local `saw scan`: show the verdict AND the full findings breakdown in the CI
      # terminal, not just the streamed one-liner. Rendered from the REDACTED latest.json — NEVER
      # saw's raw stdout, which prints evidence verbatim — with untrusted paths sanitized against
      # ANSI / `::`-workflow-command injection and the list bounded. Strictly additive & non-fatal:
      # it only reads the report and prints; the scan invocation and the gate are untouched. When an
      # old pinned scanner didn't write latest.json, it quietly no-ops (today's terse log).
      run: |
        set +e
        SAW_GUARD_REDACTED="$SAW_GUARD_REPORTS_DIR/latest.json" \
        PYTHONPATH="$GITHUB_ACTION_PATH" python3 -m guard log \
          || echo "::notice::SAW Guard: could not render the scan report to the log (non-fatal)."
        exit 0

    - name: Remediate — saw fix --pr (rolling security/auto-clean PR)
      id: remediate
      if: inputs.remediate == 'pr' && steps.scan.outputs.infected != '0'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      # Runs only after an infected verdict, and BEFORE the gate goes red, so the cleanup PR
      # exists by the time a human looks at the failed check. saw rebuilds the fix in an
      # isolated worktree off the remote's DEFAULT branch — it never commits to the default
      # branch and never force-pushes — so on a pull_request event this remediates the
      # repository's real state, not the PR's synthetic merge ref (a payload that exists only
      # in the PR has nothing to remediate; the red gate on the PR is the remedy). A failure
      # here fails the job loudly rather than pretending the guard remediated when it didn't.
      run: |
        set -uo pipefail
        if ! fix_help=$(saw fix -h 2>/dev/null); then
          echo "::error::remediate is 'pr' but the installed stayawakebot lacks 'saw fix' — set 'version' to a release that ships it." >&2
          exit 1
        fi
        cfg_flag=()
        if [ -n "${{ steps.scan.outputs.config }}" ]; then
          cfg_flag=(-c "${{ steps.scan.outputs.config }}")
        fi
        cd "$GITHUB_WORKSPACE"
        report=""
        if [[ "$fix_help" == *--json* ]]; then
          report="$RUNNER_TEMP/saw-guard-remediation.json"
          saw fix --pr "$GITHUB_WORKSPACE" "${cfg_flag[@]+"${cfg_flag[@]}"}" --no-stream --json > "$report"
        else
          saw fix --pr "$GITHUB_WORKSPACE" "${cfg_flag[@]+"${cfg_flag[@]}"}" --no-stream
        fi
        rc=$?
        patches=false
        compgen -G "$GITHUB_WORKSPACE/sab-patches/*.patch" >/dev/null 2>&1 && patches=true
        SAW_GUARD_REMEDIATION_REPORT="$report" SAW_GUARD_PATCHES="$patches" \
        PYTHONPATH="$GITHUB_ACTION_PATH" python3 -m guard remediation || {
          echo "remediation=unknown" >> "$GITHUB_OUTPUT"
          echo "::warning title=SAW Guard remediation::could not read what remediation came to — see this step's log."
        }
        exit "$rc"

    # ── Visibility layer (issue #10) — strictly ADDITIVE, strictly NON-FATAL ────────────────
    # These steps route findings to where a reviewer looks (step summary, code scanning, an
    # artifact, a PR comment). They run BEFORE the gate so the evidence is in place when the check
    # turns red, but they can NEVER change the gate outcome: the verdict was already decided in the
    # "Run worm scan" step and the gate reads only those outputs. Composite steps can't use
    # `continue-on-error`, so each `run:` step swallows its own failures with `|| ::notice::` and
    # ends `exit 0` — a missing permission, a fork PR, or even a bug degrades to a notice.

    - name: SAW Guard — actionable findings summary (step summary + PR-comment source)
      if: always()
      shell: bash
      # Runs even on an ABORTED (fail-closed) scan, so "red gate — now what?" is answered there too.
      # The renderer redacts (renders NO raw evidence) and escapes untrusted paths; see the
      # guard package (run as `python3 -m guard`). Non-fatal by construction.
      env:
        SAW_GUARD_VERDICT: ${{ steps.scan.outputs.verdict }}
        SAW_GUARD_INFECTED: ${{ steps.scan.outputs.infected }}
        SAW_GUARD_SUSPICIOUS: ${{ steps.scan.outputs.suspicious }}
        SAW_GUARD_FINDINGS: ${{ steps.scan.outputs.findings }}
        SAW_GUARD_SCAN_RC: ${{ steps.scan.outputs.scan-rc }}
        SAW_GUARD_CONFIG_INPUT: ${{ inputs.config-file }}
      run: |
        set +e
        reports_dir="$SAW_GUARD_REPORTS_DIR"   # exported once by the scan step (single source of truth)
        patches=false
        compgen -G "$GITHUB_WORKSPACE/sab-patches/*.patch" >/dev/null 2>&1 && patches=true
        SAW_GUARD_REPORT="$reports_dir/report.json" \
        SAW_GUARD_REDACTED="$reports_dir/latest.json" \
        SAW_GUARD_SUMMARY_OUT="$reports_dir/summary.md" \
        SAW_GUARD_PATCHES="$patches" \
        PYTHONPATH="$GITHUB_ACTION_PATH" python3 -m guard \
          || echo "::notice::SAW Guard: could not render the findings summary (non-fatal)."
        exit 0

    - name: SAW Guard — upload SARIF to code scanning (best-effort, additive)
      if: (success() || steps.remediate.outcome == 'failure') && inputs.upload-sarif == 'true' && steps.scan.outputs.sarif != ''
      shell: bash
      # Uploads the scanner's REDACTED SARIF to code scanning → Security tab + inline annotation on
      # the exact line. GITHUB_SHA/GITHUB_REF are correct for push AND the PR merge ref. A 403 (no
      # `security-events: write` / fork PR) is swallowed as a notice — never fails the job.
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        SARIF: ${{ steps.scan.outputs.sarif }}
      run: |
        set +e
        if ! command -v gh >/dev/null 2>&1; then
          echo "::notice::SAW Guard: 'gh' unavailable (self-hosted runner?) — SARIF upload skipped; the SARIF is in the 'sarif' output / the artifact."
          exit 0
        fi
        if [ ! -s "$SARIF" ]; then
          echo "::notice::SAW Guard: SARIF file missing/empty — upload skipped."
          exit 0
        fi
        b64="$RUNNER_TEMP/saw-guard.sarif.b64"
        if ! gzip -c "$SARIF" | base64 | tr -d '\n' > "$b64"; then
          echo "::notice::SAW Guard: could not encode SARIF — upload skipped."
          exit 0
        fi
        if jq -n --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF" --rawfile z "$b64" \
              '{commit_sha:$sha, ref:$ref, sarif:$z}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/code-scanning/sarifs" --input - >/dev/null 2>&1; then
          echo "SAW Guard: uploaded SARIF to code scanning — findings will appear in the Security tab and as inline annotations."
        else
          echo "::notice::SAW Guard: SARIF upload skipped — needs 'security-events: write' (unavailable on fork PRs / not granted). Findings are still in the step summary and, if enabled, the artifact."
        fi
        exit 0

    - name: SAW Guard — stage redacted evidence for the artifact
      if: (success() || steps.remediate.outcome == 'failure') && inputs.upload-artifact == 'true'
      shell: bash
      # Stage REDACTED artifacts only. NEVER the full-evidence report.json and never the raw
      # infected file. `sab-patches/*.patch` is a git-am-able diff that REMOVES the payload (its
      # removed lines therefore contain it) — kept because it is the remediation deliverable.
      run: |
        set +e
        reports_dir="$SAW_GUARD_REPORTS_DIR"   # exported once by the scan step (single source of truth)
        stage="$RUNNER_TEMP/saw-guard-artifact"
        mkdir -p "$stage"
        for f in latest.json latest.md summary.md saw-guard.sarif; do
          [ -f "$reports_dir/$f" ] && cp "$reports_dir/$f" "$stage/" 2>/dev/null
        done
        if compgen -G "$GITHUB_WORKSPACE/sab-patches/*.patch" >/dev/null 2>&1; then
          mkdir -p "$stage/sab-patches"
          cp "$GITHUB_WORKSPACE"/sab-patches/*.patch "$stage/sab-patches/" 2>/dev/null
        fi
        exit 0

    - name: SAW Guard — upload evidence artifact
      if: (success() || steps.remediate.outcome == 'failure') && inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
      with:
        # Per-job unique name (+ overwrite) so running SAW Guard in more than one job of a workflow
        # can't hit upload-artifact@v4's duplicate-name failure — which, being a `uses:` step,
        # couldn't be softened and would violate the additive/non-fatal contract.
        name: saw-guard-evidence-${{ github.job }}
        path: ${{ runner.temp }}/saw-guard-artifact
        if-no-files-found: ignore
        overwrite: true
        retention-days: 7

    - name: SAW Guard — sticky PR comment with remediation guidance (best-effort, additive)
      if: (success() || steps.remediate.outcome == 'failure') && inputs.pr-comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      # Post ONE sticky comment (found & updated in place via a hidden marker), reusing the exact
      # markdown the summary rendered (DRY). Body is passed as a file through `jq --rawfile`, so no
      # untrusted content is ever interpolated into the shell. A missing `pull-requests: write`
      # (fork PR / not granted) degrades to a notice.
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        VERDICT: ${{ steps.scan.outputs.verdict }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set +e
        body="$SAW_GUARD_REPORTS_DIR/summary.md"   # exported once by the scan step (single source of truth)
        marker="<!-- saw-guard-summary -->"
        earlier_marker="<!-- strix-worm-scan-summary -->"
        repo="$GITHUB_REPOSITORY"
        if ! command -v gh >/dev/null 2>&1 || ! command -v jq >/dev/null 2>&1; then
          echo "::notice::SAW Guard: 'gh'/'jq' unavailable — PR comment skipped."
          exit 0
        fi
        if [ ! -s "$body" ]; then
          echo "::notice::SAW Guard: no rendered summary — PR comment skipped."
          exit 0
        fi
        existing="$(gh api "repos/$repo/issues/$PR_NUMBER/comments" --paginate \
                    --jq ".[] | select((.body|contains(\"$marker\")) or (.body|contains(\"$earlier_marker\"))) | .id" 2>/dev/null | head -n1)"
        if [ -n "$existing" ] && [ "$existing" != "null" ]; then
          jq -n --rawfile b "$body" '{body:$b}' \
            | gh api --method PATCH "repos/$repo/issues/comments/$existing" --input - >/dev/null 2>&1 \
            && echo "SAW Guard: updated the sticky PR comment." \
            || echo "::notice::SAW Guard: could not update the PR comment (needs 'pull-requests: write'; unavailable on fork PRs)."
        elif [ "$VERDICT" != "clean" ]; then
          jq -n --rawfile b "$body" '{body:$b}' \
            | gh api --method POST "repos/$repo/issues/$PR_NUMBER/comments" --input - >/dev/null 2>&1 \
            && echo "SAW Guard: posted a sticky PR comment with remediation guidance." \
            || echo "::notice::SAW Guard: could not post the PR comment (needs 'pull-requests: write'; unavailable on fork PRs)."
        else
          echo "SAW Guard: clean with no prior comment — nothing to post."
        fi
        exit 0

    - name: Enforce verdict gate
      shell: bash
      # The gate proper. `saw scan` exits 1 when infected and 0 when clean, unconditionally;
      # rc=1 is treated as infected even if the report undercounts, so a verdict/report
      # disagreement can never fail open. Runs AFTER remediation so the fix PR is already up
      # when the check turns red — and it turns red regardless: only a clean tree is green.
      run: |
        set -euo pipefail
        infected='${{ steps.scan.outputs.infected }}'
        suspicious='${{ steps.scan.outputs.suspicious }}'
        rc='${{ steps.scan.outputs.scan-rc }}'
        if [ "${{ inputs.fail-on }}" = "never" ]; then
          echo "SAW Guard: report-only (fail-on: never) — verdict '${{ steps.scan.outputs.verdict }}' does not gate."
          exit 0
        fi
        if [ "$infected" -gt 0 ] || [ "$rc" = "1" ]; then
          echo "::error::worm indicators found — ${infected} infected target(s)." >&2; exit 1
        fi
        if [ "${{ inputs.fail-on }}" = "suspicious" ] && [ "$suspicious" -gt 0 ]; then
          echo "::error::suspect-tier findings on ${suspicious} target(s) and fail-on is 'suspicious'." >&2; exit 1
        fi
        echo "SAW Guard: clean — all scanned targets are free of worm indicators."
